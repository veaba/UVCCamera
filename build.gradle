// Top-level build file for UVCCamera submodule
// Updated for Gradle 8.7 + AGP 8.5.0 compatibility

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://raw.githubusercontent.com/saki4510t/libcommon/master/repository/' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

ext {
    versionCompiler = 34
    versionTarget = 34
    versionBuildTool = "34.0.0"
    minSdkVersion = 21
    javaSourceCompatibility = JavaVersion.VERSION_17
    javaTargetCompatibility = JavaVersion.VERSION_17
    supportLibVersion = "28.0.0"
    commonLibVersion = "2.12.4"
}